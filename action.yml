name: medtrace
description: Fail the build when a requirement has no code, no passing test, or a risk has no verified control.
inputs:
  junit:
    description: Space-separated JUnit XML files or globs with test results
    required: false
    default: ""
  report:
    description: Where to write the Markdown traceability matrix
    required: false
    default: traceability.md
  strict:
    description: Treat warnings as errors
    required: false
    default: "false"
  working-directory:
    description: Repository root to check
    required: false
    default: "."
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(check --report "${{ inputs.report }}")
        shopt -s nullglob globstar
        for pattern in ${{ inputs.junit }}; do
          for f in $pattern; do args+=(--junit "$f"); done
        done
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        medtrace "${args[@]}"
